version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn tender_trail.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGO_HOST: mongo
    depends_on:
      mongo:
        condition: service_healthy

  scraper:
    build: .
    restart: unless-stopped
    command: python manage.py run_scraper --loop
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      MONGO_HOST: mongo
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  static_data:
  media_data:
